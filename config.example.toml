[app]
database = "data/seen.sqlite3"

[logging]
level = "INFO"
file = "logs/kleinanzeigen-finder.log"
rotation = "10 MB"
retention = "14 days"

[scraper]
headless = true
timeout_ms = 30000
detail_delay_seconds = 0.8
detail_concurrency = 1
user_agent = ""

[immoscout]
api_base_url = "https://api.mobile.immobilienscout24.de"
user_agent = "ImmoScout_27.12_26.2_._"
page_size = 50

[ebay]
# Separate Chrome process, native user agent, isolated session. Linux needs DISPLAY.
headless = false
# Optional installed Chrome/Chromium executable; otherwise detected automatically.
browser_executable = ""
# Dedicated application profile only; never point this at your personal Chrome profile.
# Empty uses a temporary profile. This path preserves the browser session across runs.
profile_dir = "data/ebay-browser"

[telegram]
enabled = true
bot_token_env = "TELEGRAM_BOT_TOKEN"
chat_id_env = "TELEGRAM_CHAT_ID"
disable_web_page_preview = false

[discord]
enabled = false
token_env = "DISCORD_BOT_TOKEN"
guild_id_env = "DISCORD_GUILD_ID"
admin_role_ids = []
category_name = "kleinanzeigen"
review_channel_name = "kf-review"
channel_prefix = "kf-"
sync_commands = true

[whatsapp]
enabled = false
session_db = "data/whatsapp_session.sqlite3"
target_phone = ""

[llm]
enabled = true
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com/v1"
model = "gpt-6-astra"
min_score = 70
timeout_seconds = 90
max_retries = 2
retry_delay_seconds = 3
classification_concurrency = 2
max_description_chars = 3500

# 0 disables image inputs; supported range 0..32
max_images = 8
image_detail = "auto"
